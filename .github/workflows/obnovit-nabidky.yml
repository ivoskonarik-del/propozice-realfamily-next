# Obnova nabídek nemovitostí — běží v cloudu, ne na ničím počítači.
#
# Proč tudy: web je statický a sám nic spustit neumí. GitHub Actions ale
# spustit umí a jsou u veřejného repozitáře zdarma. Klientka tak není závislá
# na tom, jestli má někdo u nás zapnutý počítač.
#
# Spouštěče:
#   * schedule — sám od sebe, aby web nezestárl, ani když nikdo neklikne;
#   * workflow_dispatch — ruční spuštění (tlačítko „Run workflow").
#
# Zdroj nabídek je v proměnné repozitáře SREALITY_URL
# (Settings → Secrets and variables → Actions → Variables).

name: Obnovit nabídky

on:
  workflow_dispatch:
  repository_dispatch:
    types: [obnovit-nabidky]
  schedule:
    # Každou hodinu. Profil kanceláře + pět detailů je pro portál drobný provoz.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  # Dvě obnovy najednou by si přepisovaly data-nabidky.ts pod rukama.
  group: obnovit-nabidky
  cancel-in-progress: false

jobs:
  obnovit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Závislosti
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 Pillow
          npm install --no-audit --no-fund

      - name: Načíst aktuální nabídky
        env:
          SREALITY_URL: ${{ vars.SREALITY_URL }}
        run: |
          python tools/obnov_nabidky.py --projekt . --sreality "$SREALITY_URL" --zapsat

      - name: Postavit web
        run: npx next build

      - name: Uložit data zpět do repozitáře
        run: |
          git config user.name "Obnova nabidek"
          git config user.email "info.webhunter@email.cz"
          git add src/app/data-nabidky.ts public/images/nabidky || true
          # Beze změny není co commitovat, a to není chyba.
          git diff --staged --quiet || git commit -m "Obnova nabidek $(date +%F' '%H:%M)"
          git push || true

      - name: Nasadit
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
